title: LiteBites
description: Bite-sized notes on AI and computer science research.
url: "https://litebites.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul

# GoatCounter site code. After creating your site at GoatCounter, set this to
# the subdomain code, e.g. "litebites" for https://litebites.goatcounter.com.
goatcounter_code: "litebites"

# Modular graph explorer. Set enabled to false to hide site navigation to it.
knowledge_graph:
  enabled: true

permalink: /posts/:title/

collections:
  posts:
    output: true
  articles:
    output: true
    permalink: /articles/:name/
  datasets:
    output: true
    permalink: /data/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      type: Paper brief
  - scope:
      path: ""
      type: "articles"
    values:
      layout: article
      type: Article Bite
  - scope:
      path: ""
      type: "datasets"
    values:
      layout: dataset

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - USAGE.md
  - POLICY_POST.md
  - POLICY_ARTICLE.md
  - .hermes
  - scripts
