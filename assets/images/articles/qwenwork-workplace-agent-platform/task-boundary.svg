<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">QwenWork task, tools, outputs, and governance boundary</title>
  <desc id="desc">A LiteBites synthesis showing instructions, files, and workplace messages entering a persistent QwenWork task, which can select a model and use skills or connectors to create editable office, web, data, and media artifacts, with security checks around permissions and review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#475569"/></marker>
    <style>.h{font:700 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:500 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.label{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.tiny{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.box{fill:#fff;stroke-width:3;filter:url(#shadow)}.line{fill:none;stroke:#475569;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="92" class="h">QwenWork is an execution and delivery layer</text>
  <text x="80" y="136" class="sub">The model is one component inside a persistent task, connector, skill, and human-review boundary.</text>

  <rect x="70" y="250" width="300" height="300" rx="28" class="box" stroke="#0ea5e9"/>
  <text x="220" y="310" text-anchor="middle" class="label">Inputs</text>
  <text x="220" y="365" text-anchor="middle" class="small">Instructions</text>
  <text x="220" y="405" text-anchor="middle" class="small">Attachments</text>
  <text x="220" y="445" text-anchor="middle" class="small">Workplace messages</text>
  <text x="220" y="485" text-anchor="middle" class="small">Prior task context</text>

  <rect x="505" y="210" width="590" height="380" rx="32" fill="#fff" stroke="#7c3aed" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="270" text-anchor="middle" class="label">Persistent QwenWork task</text>
  <rect x="555" y="325" width="220" height="105" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <rect x="825" y="325" width="220" height="105" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <rect x="555" y="465" width="220" height="80" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <rect x="825" y="465" width="220" height="80" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="665" y="372" text-anchor="middle" class="label">Model choice</text>
  <text x="665" y="405" text-anchor="middle" class="small">switch within task</text>
  <text x="935" y="372" text-anchor="middle" class="label">Skills</text>
  <text x="935" y="405" text-anchor="middle" class="small">marketplace or folder</text>
  <text x="665" y="515" text-anchor="middle" class="label">Execution history</text>
  <text x="935" y="515" text-anchor="middle" class="label">Connectors</text>

  <rect x="1230" y="250" width="300" height="300" rx="28" class="box" stroke="#10b981"/>
  <text x="1380" y="310" text-anchor="middle" class="label">Delivered artifacts</text>
  <text x="1380" y="365" text-anchor="middle" class="small">Word · PowerPoint · Excel</text>
  <text x="1380" y="405" text-anchor="middle" class="small">HTML and published web</text>
  <text x="1380" y="445" text-anchor="middle" class="small">Data summaries</text>
  <text x="1380" y="485" text-anchor="middle" class="small">Multimodal content</text>
  <path d="M370 400H500" class="line"/><path d="M1095 400H1225" class="line"/>

  <rect x="280" y="665" width="1040" height="110" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="800" y="710" text-anchor="middle" class="label">LiteBites-recommended implementation checks</text>
  <text x="800" y="750" text-anchor="middle" class="small">connector permissions · data residency · retention · audit logs · output review · installed-skill trust</text>
  <text x="80" y="852" class="tiny">LiteBites synthesis from Alibaba's launch announcement and QwenWork workflow, privacy, skills, and IM-channel documentation.</text>
</svg>
