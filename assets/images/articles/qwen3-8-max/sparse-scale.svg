<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.8 sparse-scale architecture summary</title>
  <desc id="desc">A LiteBites diagram showing Qwen3.8's 2.4 trillion stored parameters, 95 billion active parameters per token, 92 layers organized as 23 repeated blocks, 512 experts with 10 routed and one shared expert active, and 262,144-token native context extensible to about 1.01 million.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.h{font:700 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:500 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.big{font:800 64px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4f46e5}.label{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.tiny{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.box{fill:#fff;stroke:#c4b5fd;stroke-width:3;filter:url(#shadow)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="92" class="h">Qwen3.8 combines huge stored scale with sparse activation</text>
  <text x="80" y="136" class="sub">Active parameters describe per-token routing—not checkpoint storage, memory footprint, or hosted-service equivalence.</text>

  <rect x="80" y="220" width="430" height="230" rx="28" class="box"/>
  <text x="295" y="310" text-anchor="middle" class="big">2.4T</text>
  <text x="295" y="360" text-anchor="middle" class="label">total parameters</text>
  <text x="295" y="405" text-anchor="middle" class="small">stored across the checkpoint</text>

  <rect x="585" y="220" width="430" height="230" rx="28" class="box"/>
  <text x="800" y="310" text-anchor="middle" class="big">95B</text>
  <text x="800" y="360" text-anchor="middle" class="label">active per token</text>
  <text x="800" y="405" text-anchor="middle" class="small">selected through mixture-of-experts routing</text>

  <rect x="1090" y="220" width="430" height="230" rx="28" class="box"/>
  <text x="1305" y="310" text-anchor="middle" class="big">512</text>
  <text x="1305" y="360" text-anchor="middle" class="label">experts</text>
  <text x="1305" y="405" text-anchor="middle" class="small">10 routed + 1 shared active</text>

  <rect x="140" y="555" width="620" height="190" rx="28" class="box"/>
  <text x="450" y="615" text-anchor="middle" class="label">92 layers = 23 repeated blocks</text>
  <text x="450" y="665" text-anchor="middle" class="small">3 × (Gated DeltaNet → MoE)</text>
  <text x="450" y="704" text-anchor="middle" class="small">then 1 × (Gated Attention → MoE)</text>

  <rect x="840" y="555" width="620" height="190" rx="28" class="box"/>
  <text x="1150" y="615" text-anchor="middle" class="label">Context window</text>
  <text x="1150" y="665" text-anchor="middle" class="small">262,144 tokens native</text>
  <text x="1150" y="704" text-anchor="middle" class="small">extensible to about 1,010,000 tokens</text>

  <text x="80" y="852" class="tiny">LiteBites synthesis from the official Qwen3.8-2.4T-A95B model card. The managed Qwen3.8-Max service adds features beyond this downloadable artifact.</text>
</svg>
