<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" role="img" aria-labelledby="title desc">
<title id="title">Rerank 8B compared with Qwen3-VL Reranker 8B</title>
<desc id="desc">ViDoRe v3.1 reranking, 40 candidate-list tasks, mean nDCG at 10 on a zero-to-100 display scale: Nemotron 3.5 Rerank 8B BF16 60.49, Qwen3-VL-Reranker-8B 59.17. Lists were assembled from four first-stage retrievers; this is not one fixed end-to-end pipeline.</desc>
