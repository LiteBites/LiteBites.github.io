<g fill="#485650" font-size="18"><text x="74" y="314">0</text><text x="281" y="314">25</text><text x="493" y="314">50</text><text x="706" y="314">75</text><text x="912" y="314">100</text></g>
<path d="M50 334 H1150" stroke="#bcc6bd"/>
