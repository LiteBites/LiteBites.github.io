<text x="50" y="91" font-size="21" fill="#485650">ViDoRe v3.1 Reranking · 40 candidate-list tasks · mean nDCG@10 (0–100 ↑)</text>
<g fill="#1d2521" font-size="25"><text x="78" y="148">Nemotron 3.5 Rerank 8B BF16</text><text x="78" y="238">Qwen3-VL-Reranker-8B</text></g>
<g fill="#e1e6e0"><rect x="80" y="166" width="850" height="18" rx="9"/><rect x="80" y="256" width="850" height="18" rx="9"/></g>
