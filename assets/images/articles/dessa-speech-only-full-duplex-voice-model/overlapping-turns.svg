<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc">
  <title id="title">Dessa can listen while speaking</title>
  <desc id="desc">Conceptual three-lane sequence: a person speaks while Dessa listens; Dessa then starts a reply before listening stops. The overlap is a reported conversational capability, not a measured timeline.</desc>
  <rect width="480" height="560" fill="#111815"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="26" y="44" fill="#adf65b" font-size="15" font-weight="700" letter-spacing="1">VOICE / FULL-DUPLEX</text>
    <text x="26" y="91" fill="#f3f6ed" font-size="30" font-weight="700">A turn need not end</text>
    <text x="26" y="120" fill="#b8c5bb" font-size="17">for the next one to begin.</text>
    <line x1="26" y1="152" x2="454" y2="152" stroke="#3b4c40"/>
    <g fill="#b8c5bb" font-size="14" letter-spacing="0.5">
      <text x="176" y="180">START</text>
      <text x="298" y="180">OVERLAP</text>
    </g>
    <g stroke="#3b4c40" stroke-width="1">
      <line x1="176" y1="192" x2="176" y2="405"/>
      <line x1="295" y1="192" x2="295" y2="405"/>
    </g>
    <g fill="#f3f6ed" font-size="18" font-weight="700">
      <text x="26" y="229">You</text>
      <text x="26" y="256">speak</text>
      <text x="26" y="307">Dessa</text>
      <text x="26" y="334">listens</text>
      <text x="26" y="385">Dessa</text>
      <text x="26" y="412">replies</text>
    </g>
    <rect x="176" y="215" width="177" height="48" fill="#f3f6ed"/>
    <rect x="176" y="293" width="278" height="48" fill="#83c84e"/>
    <rect x="295" y="371" width="159" height="48" fill="#48aacf"/>
    <rect x="295" y="207" width="58" height="220" fill="none" stroke="#f6dd6e" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="26" y="472" fill="#f6dd6e" font-size="18" font-weight="700">THE KEY CLAIM</text>
    <text x="26" y="504" fill="#f3f6ed" font-size="19">It can hear you while talking.</text>
    <text x="26" y="533" fill="#b8c5bb" font-size="14">Schematic only · not measured timing</text>
  </g>
</svg>
