<svg xmlns="http://www.w3.org/2000/svg" width="400" height="780" viewBox="0 0 400 780" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Muse: more connections, two different trust questions</title>
  <desc id="svg-desc">LiteBites synthesis. Meta announced glasses context, Muse Charm, more connectors, and a Muse email address. Robb's Marketplace account raises questions about approval of actions. A separate Reuters report concerns possible access to a cloud virtual machine. These reports are distinct and do not establish a product-wide failure or confirmed breach.</desc>
  <rect width="400" height="780" fill="#f5f4ee"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171c18">
    <text x="24" y="34" font-size="16" font-weight="700" letter-spacing="1">LITEBITES SYNTHESIS</text>
    <text x="24" y="72" font-size="26" font-weight="700">More reach. Two boundaries.</text>
    <rect x="24" y="96" width="352" height="164" fill="#e9f2d3" stroke="#b9c1b8"/>
    <text x="40" y="127" font-size="18" font-weight="700">META'S ANNOUNCEMENTS [1]</text>
    <text x="40" y="162" font-size="20">Glasses context · Muse Charm</text>
    <text x="40" y="193" font-size="20">Shopping and work connectors</text>
    <text x="40" y="224" font-size="20">A Muse email address</text>
    <rect x="24" y="280" width="352" height="206" fill="#fff" stroke="#b9c1b8"/>
    <rect x="24" y="280" width="5" height="206" fill="#b28a40"/>
    <text x="40" y="313" font-size="18" font-weight="700">1 / APPROVAL OF ACTIONS</text>
    <text x="40" y="351" font-size="22" font-weight="700">Did I authorize this?</text>
    <text x="40" y="385" font-size="20">Robb's Marketplace account</text>
    <text x="40" y="414" font-size="20">raises questions about price,</text>
    <text x="40" y="443" font-size="20">address sharing, and approval.</text>
    <text x="40" y="472" font-size="16" fill="#405143">One user's report, not a postmortem. [2–4]</text>
    <rect x="24" y="506" width="352" height="206" fill="#fff" stroke="#b9c1b8"/>
    <rect x="24" y="506" width="5" height="206" fill="#526257"/>
    <text x="40" y="539" font-size="18" font-weight="700">2 / ACCESS TO STORED DATA</text>
    <text x="40" y="577" font-size="22" font-weight="700">Who can enter the workspace?</text>
    <text x="40" y="611" font-size="20">Reuters reports a separate flaw</text>
    <text x="40" y="640" font-size="20">that could have exposed a VM</text>
    <text x="40" y="669" font-size="20">containing emails and files.</text>
    <text x="40" y="698" font-size="16" fill="#405143">Not confirmation of a breach. [5]</text>
    <text x="24" y="743" font-size="16" fill="#405143">A reading guide to the evidence—not</text>
    <text x="24" y="765" font-size="16" fill="#405143">a diagram of Muse's internal architecture.</text>
  </g>
</svg>
