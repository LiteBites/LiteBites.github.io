<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GPT-6 Astra capability evidence and deployment boundaries</title>
  <desc id="desc">Three columns separate the model and tool surface, OpenAI's vendor-run computer-use and cybersecurity evaluations, and production access controls. A footer warns that the evaluation results do not establish independent production reliability.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ff3f"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .head { font-size: 31px; font-weight: 800; }
      .body { font-size: 21px; fill: #d8d8d2; }
      .small { font-size: 17px; fill: #a9aaa4; }
      .metric { font-size: 24px; font-weight: 800; fill: #f7f6f0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#10110f"/>
  <path d="M0 0H1600V900H0Z" fill="none" stroke="#30322e" stroke-width="2"/>

  <g class="sans">
    <rect x="60" y="48" width="260" height="38" rx="19" fill="#d7ff3f"/>
    <text x="190" y="74" text-anchor="middle" class="mono label" fill="#10110f">LITEBITES SYNTHESIS</text>
    <text x="60" y="145" font-size="56" font-weight="850" fill="#f7f6f0">Capability is not the same as deployment</text>
    <text x="60" y="188" font-size="23" fill="#a9aaa4">GPT-6 Astra’s tool surface, vendor-run evaluations, and production safeguards are three different evidence layers.</text>

    <path d="M520 454H558" stroke="#d7ff3f" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1030 454H1068" stroke="#d7ff3f" stroke-width="5" marker-end="url(#arrow)"/>

    <!-- model and tools -->
    <g>
      <rect x="60" y="235" width="460" height="505" rx="18" fill="#171a18" stroke="#65d8ff" stroke-width="3"/>
      <text x="90" y="278" class="mono label" fill="#65d8ff">01 / AGENT SURFACE</text>
      <text x="90" y="330" class="sans head" fill="#f7f6f0">Model plus tools</text>
      <line x1="90" y1="354" x2="490" y2="354" stroke="#3d4542"/>

      <text x="90" y="402" class="mono small">CONTEXT CEILING</text>
      <text x="90" y="440" class="sans metric">1,050,000 tokens</text>
      <text x="90" y="475" class="sans small">922K max input · 128K max output</text>

      <rect x="90" y="510" width="380" height="1" fill="#343a38"/>
      <text x="90" y="555" class="mono small">RESPONSES API TOOLS</text>
      <text x="90" y="596" class="sans body">
        <tspan x="90" dy="0">computer use · web search</tspan>
        <tspan x="90" dy="36">file search · code execution</tspan>
        <tspan x="90" dy="36">patching · MCP</tspan>
      </text>
      <text x="90" y="704" class="mono small">SYSTEM CAPABILITY DEPENDS ON</text>
      <text x="90" y="730" class="sans small">model + tools + prompt + harness</text>
    </g>

    <!-- vendor evidence -->
    <g>
      <rect x="570" y="235" width="460" height="505" rx="18" fill="#171a18" stroke="#fbbf24" stroke-width="3"/>
      <text x="600" y="278" class="mono label" fill="#fbbf24">02 / VENDOR EVIDENCE</text>
      <text x="600" y="330" class="sans head" fill="#f7f6f0">Measured in test setups</text>
      <line x1="600" y1="354" x2="1000" y2="354" stroke="#51462a"/>

      <text x="600" y="398" class="mono small">OSWORLD 2.0 OFFLINE SUBSET</text>
      <text x="600" y="430" class="sans small">partial score · latency simulation</text>
      <text x="1000" y="430" text-anchor="end" class="mono small">0–100 score</text>
      <text x="600" y="475" class="sans body">Astra</text>
      <rect x="685" y="453" width="174" height="30" rx="5" fill="#d7ff3f"/>
      <text x="871" y="476" class="mono small" fill="#f7f6f0">72.6% · ~40m</text>
      <text x="600" y="520" class="sans body">Sol</text>
      <rect x="685" y="498" width="158" height="30" rx="5" fill="#6e716a"/>
      <text x="855" y="521" class="mono small" fill="#f7f6f0">65.7% · ~75m</text>

      <line x1="600" y1="557" x2="1000" y2="557" stroke="#51462a"/>
      <text x="600" y="598" class="mono small">CYBER · WITHOUT PRODUCTION SAFEGUARDS</text>
      <text x="600" y="628" class="sans body">
        <tspan x="600" dy="0">ExploitBench 100%</tspan>
        <tspan x="600" dy="32">ExploitGym 42.4% · no six-hour limit</tspan>
        <tspan x="600" dy="32">Recent V8 set 39%</tspan>
        <tspan x="600" dy="30">arbitrary code execution</tspan>
      </text>
    </g>

    <!-- deployment -->
    <g>
      <rect x="1080" y="235" width="460" height="505" rx="18" fill="#171a18" stroke="#ff7ea8" stroke-width="3"/>
      <text x="1110" y="278" class="mono label" fill="#ff7ea8">03 / DEPLOYMENT BOUNDARY</text>
      <text x="1110" y="330" class="sans head" fill="#f7f6f0">Access is staged</text>
      <line x1="1110" y1="354" x2="1510" y2="354" stroke="#543746"/>

      <rect x="1110" y="392" width="400" height="88" rx="12" fill="#251a20" stroke="#ff7ea8"/>
      <text x="1134" y="426" class="mono small" fill="#ffb0c8">OPENAI CLASSIFICATION</text>
      <text x="1134" y="460" class="sans metric">Critical cybersecurity</text>

      <text x="1110" y="526" class="sans body">
        <tspan x="1110" dy="0">• default production refusals</tspan>
        <tspan x="1110" dy="40">• account-level risk boundaries</tspan>
        <tspan x="1110" dy="40">• trajectory monitoring</tspan>
        <tspan x="1110" dy="40">• Daybreak: staged authorized access</tspan>
        <tspan x="1110" dy="40">• intervention may pause or stop work</tspan>
      </text>
      <text x="1110" y="724" class="mono small">SAFEGUARDS ALTER THE SURFACE</text>
    </g>

    <rect x="60" y="786" width="1480" height="70" rx="12" fill="#22231f" stroke="#50514b"/>
    <text x="90" y="815" class="mono label" fill="#d7ff3f">INTERPRETATION BOUNDARY</text>
    <text x="90" y="844" class="sans small">Vendor-run system results do not establish independent production reliability; evaluation and deployed configurations differ.</text>
  </g>
</svg>
