<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sequential and parallel agent execution timelines</title>
  <desc id="desc">Two schematic timelines compare a sequential workflow where four jobs run one after another with a parallel workflow where two independent jobs overlap before a merge job.</desc>
  <rect width="1600" height="900" fill="#f7f5ef"/>
  <rect x="48" y="42" width="1504" height="816" rx="18" fill="#fffdf8" stroke="#252525" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#252525">
    <text x="96" y="108" font-size="42" font-weight="700" letter-spacing="-1">Execution shape changes the wait</text>
    <text x="96" y="146" font-size="21" fill="#5e5a52">Parallel work helps only when the branches are genuinely independent.</text>
    <g stroke="#b8b7b0" stroke-width="2"><path d="M390 250 V760"/><path d="M590 250 V760"/><path d="M790 250 V760"/><path d="M990 250 V760"/><path d="M1190 250 V760"/></g>
    <g fill="#77736a" font-size="16" text-anchor="middle"><text x="390" y="226">start</text><text x="590" y="226">step 2</text><text x="790" y="226">step 3</text><text x="990" y="226">step 4</text><text x="1190" y="226">finish</text></g>
    <text x="120" y="330" font-size="18" font-weight="700" fill="#456779" letter-spacing="1.4">SEQUENTIAL</text>
    <text x="120" y="362" font-size="22" font-weight="650">Every job occupies the only lane.</text>
    <g><rect x="390" y="400" width="200" height="70" rx="10" fill="#e8eef2" stroke="#456779" stroke-width="2"/><rect x="590" y="400" width="200" height="70" rx="10" fill="#e8eef2" stroke="#456779" stroke-width="2"/><rect x="790" y="400" width="200" height="70" rx="10" fill="#e8eef2" stroke="#456779" stroke-width="2"/><rect x="990" y="400" width="200" height="70" rx="10" fill="#e8eef2" stroke="#456779" stroke-width="2"/>
    <text x="490" y="443" text-anchor="middle" font-size="21" font-weight="650">A</text><text x="690" y="443" text-anchor="middle" font-size="21" font-weight="650">B</text><text x="890" y="443" text-anchor="middle" font-size="21" font-weight="650">C</text><text x="1090" y="443" text-anchor="middle" font-size="21" font-weight="650">D</text></g>
    <path d="M120 520 H1480" stroke="#b8b7b0" stroke-width="2"/>
    <text x="120" y="600" font-size="18" font-weight="700" fill="#9a6a32" letter-spacing="1.4">PARALLEL BRANCHES</text>
    <text x="120" y="632" font-size="22" font-weight="650">Independent jobs share time, then meet at a barrier.</text>
    <g><rect x="390" y="672" width="200" height="70" rx="10" fill="#f5e9d9" stroke="#c09258" stroke-width="2"/><rect x="590" y="610" width="400" height="70" rx="10" fill="#f5e9d9" stroke="#c09258" stroke-width="2"/><rect x="590" y="700" width="400" height="70" rx="10" fill="#f5e9d9" stroke="#c09258" stroke-width="2"/><rect x="990" y="655" width="200" height="70" rx="10" fill="#252525" stroke="#252525" stroke-width="2"/>
    <text x="490" y="715" text-anchor="middle" font-size="21" font-weight="650">A</text><text x="790" y="653" text-anchor="middle" font-size="21" font-weight="650">B</text><text x="790" y="743" text-anchor="middle" font-size="21" font-weight="650">C</text><text x="1090" y="698" text-anchor="middle" font-size="21" font-weight="650" fill="#fffdf8">D</text></g>
    <text x="800" y="825" text-anchor="middle" font-size="16" fill="#77736a">Schematic timeline; durations are illustrative, not measured results.</text>
  </g>
</svg>