<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contracts and verification on an agent graph edge</title>
  <desc id="desc">A source node emits a defined result. A verifier checks that result before routing it to a downstream node, retry path, or isolated failure path.</desc>
  <rect width="1600" height="900" fill="#f7f5ef"/>
  <rect x="48" y="42" width="1504" height="816" rx="18" fill="#fffdf8" stroke="#252525" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#252525">
    <text x="96" y="108" font-size="42" font-weight="700" letter-spacing="-1">A graph needs contracts, not just arrows</text>
    <text x="96" y="146" font-size="21" fill="#5e5a52">Verification keeps one bad branch from silently contaminating the next.</text>
    <g fill="none" stroke="#77736a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M410 450 H570"/><path d="M870 450 H1030"/><path d="M720 510 V650 H1030"/><path d="M720 390 V300 H1030"/></g>
    <g fill="#77736a"><path d="M570 450 l-16 -10 v20z"/><path d="M1030 450 l-16 -10 v20z"/><path d="M1030 300 l-16 -10 v20z"/><path d="M1030 650 l-16 -10 v20z"/></g>
    <rect x="120" y="375" width="290" height="150" rx="14" fill="#e8eef2" stroke="#456779" stroke-width="2"/>
    <text x="265" y="424" text-anchor="middle" font-size="18" font-weight="700" fill="#456779" letter-spacing="1.3">SOURCE NODE</text><text x="265" y="465" text-anchor="middle" font-size="25" font-weight="650">Inspect files</text><text x="265" y="499" text-anchor="middle" font-size="18" fill="#4f5960">output: findings[]</text>
    <rect x="570" y="360" width="300" height="180" rx="14" fill="#f5e9d9" stroke="#c09258" stroke-width="2"/>
    <text x="720" y="414" text-anchor="middle" font-size="18" font-weight="700" fill="#9a6a32" letter-spacing="1.3">EDGE CHECK</text><text x="720" y="455" text-anchor="middle" font-size="25" font-weight="650">Verify result</text><text x="720" y="489" text-anchor="middle" font-size="18" fill="#665643">schema · confidence</text><text x="720" y="517" text-anchor="middle" font-size="18" fill="#665643">· policy</text>
    <rect x="1030" y="375" width="350" height="150" rx="14" fill="#252525" stroke="#252525" stroke-width="2"/>
    <text x="1205" y="424" text-anchor="middle" font-size="18" font-weight="700" fill="#d7c49d" letter-spacing="1.3">DOWNSTREAM NODE</text><text x="1205" y="465" text-anchor="middle" font-size="25" font-weight="650" fill="#fffdf8">Synthesize report</text><text x="1205" y="499" text-anchor="middle" font-size="18" fill="#d7c49d">input: verified findings[]</text>
    <rect x="1030" y="225" width="350" height="100" rx="12" fill="#eef3de" stroke="#82972a" stroke-width="2"/><text x="1205" y="266" text-anchor="middle" font-size="21" font-weight="650" fill="#536415">PASS → continue</text><text x="1205" y="296" text-anchor="middle" font-size="17" fill="#5d6c2b">verified edge</text>
    <rect x="1030" y="600" width="350" height="100" rx="12" fill="#f4e5e1" stroke="#a55b4d" stroke-width="2"/><text x="1205" y="641" text-anchor="middle" font-size="21" font-weight="650" fill="#7f3e34">FAIL → retry / isolate</text><text x="1205" y="671" text-anchor="middle" font-size="17" fill="#7f3e34">local recovery path</text>
    <text x="800" y="790" text-anchor="middle" font-size="18" fill="#5e5a52">The exact checks depend on the workflow; this diagram shows the design pattern.</text>
    <text x="800" y="825" text-anchor="middle" font-size="16" fill="#77736a">Schematic contract flow; it does not prescribe an implementation or guarantee correctness.</text>
  </g>
</svg>