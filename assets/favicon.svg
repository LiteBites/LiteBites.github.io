<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LiteBites capsule icon">
  <rect width="64" height="64" fill="#ffffff"/>
  <g transform="rotate(-32 32 32)">
    <ellipse cx="36" cy="43" rx="24" ry="7" fill="#bdbdbd" opacity="0.9"/>
    <clipPath id="capsule">
      <rect x="8" y="18" width="48" height="28" rx="14"/>
    </clipPath>
    <g clip-path="url(#capsule)">
      <rect x="8" y="18" width="24" height="28" fill="#62dfd0"/>
      <rect x="32" y="18" width="24" height="28" fill="#ef1119"/>
    </g>
    <rect x="8" y="18" width="48" height="28" rx="14" fill="none"/>
    <rect x="15" y="24" width="18" height="4" rx="2" fill="#ffffff"/>
    <rect x="41" y="24" width="10" height="4" rx="2" fill="#ffffff"/>
  </g>
</svg>
