schema_version = 1
adapter = "jekyll"
archive_name = "Jekyll Paper Archive"
default_language = "en"

[paths]
content_dir = "_posts"
assets_dir = "assets/papers/{slug}"
filename_template = "{published_date}-{slug}.md"
path_base = "archive-root"
collision_policy = "stop"

[metadata]
format = "yaml-frontmatter"
required = ["title", "date", "summary", "source_url"]
optional = ["layout", "short_title", "authors", "venue", "tags", "doi", "arxiv_id", "project_url", "code_url"]
tags_field = "tags"
authors_field = "authors"

[body]
sections = ["Why it matters", "Core idea", "How it works", "Evidence", "Limitations", "Practical takeaways", "Sources"]
min_words = 600
max_words = 1800

[figures]
mode = "optional"
preferred_count = 2
link_style = "liquid"
require_alt_text = true
require_provenance = true
hotlink_external_images = false

[hooks]
after_write = []

[validation]
commands = ["bundle exec jekyll build --destination .paper-archive-preview"]
build_destination = ".paper-archive-preview"
check_relative_links = true
check_local_images = true
check_external_sources = true
inspect_generated_entry = true

[publishing]
mode = "review-only"
allow_commit_after_explicit_approval = true
allow_remote_publish_after_explicit_approval = true
